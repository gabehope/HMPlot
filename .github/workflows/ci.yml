# Every push and pull request (R2.3). No GPU is needed: the unit tests run jax-js on its CPU
# backend, and exports fall back to Chrome's software WebGPU (SwiftShader) on the runners.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: Unit tests, types, Python, package and the API report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the API check compares with the default branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: npm ci
      # The formatted areas of the refactor (docs/REFACTOR-PLAN-2026-10-09.md); each stage adds its own.
      - run: npm run format:check
      - run: npm test
      - run: npm run check
      - run: npm run check:python-signatures
      - name: The API report is current, and a change has a CHANGELOG entry
        run: node scripts/api-report.mjs --check && node scripts/check-api-changelog.mjs "origin/${{ github.event.repository.default_branch }}"
      # The notebook and export bundles are built, not kept in git (R1.4): pytest's exports and
      # the wheel need them.
      - run: npm run build:python
      - name: THIRD_PARTY_NOTICES.md lists what the bundles contain (npm run build:python rewrites it)
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: python -m pip install -e "python[test,dataframes,arrow,netcdf]"
      - name: pytest (exports draw in the runner's Chrome, on SwiftShader)
        run: python -m pytest python/tests -q
        env:
          PYTHONPATH: python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:package

  # The bundles once, for the jobs without Node: they install ./python with them in place, so the
  # build hook (python/hatch_build.py) has nothing to build.
  bundles:
    name: The notebook and export bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:python
      - uses: actions/upload-artifact@v7
        with:
          name: python-bundles
          path: python/hmplot/static
          retention-days: 3

  python:
    name: Python ${{ matrix.python }}, NumPy ${{ matrix.numpy }}, ${{ matrix.extras }}
    needs: bundles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        numpy: ["2"]
        extras: ["with dataframes", "minimal"]
        include:
          # NumPy 1.x has no wheels past Python 3.12.
          - { python: "3.11", numpy: "1", extras: "with dataframes" }
          - { python: "3.12", numpy: "1", extras: "minimal" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-bundles
          path: python/hmplot/static
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          numpy='numpy>=2,<3'; [ "${{ matrix.numpy }}" = 1 ] && numpy='numpy>=1.24,<2'
          extras=''; [ "${{ matrix.extras }}" = "with dataframes" ] && extras='pandas polars pyarrow'
          python -m pip install ./python pytest pytest-asyncio hatchling "$numpy" $extras
      - run: python -m pytest python/tests -q
        env:
          PYTHONPATH: python

  install:
    name: pip install, a scene and exports on ${{ matrix.os }}
    needs: bundles
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-bundles
          path: python/hmplot/static
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ./python
      - name: Export smoke test (the runners' Chrome; SwiftShader without a GPU)
        working-directory: ${{ runner.temp }}
        shell: python
        run: |
          import hmplot as hm
          with hm.Plot(data={"x": [0.0, 1.0, 2.0], "y": [1.0, 3.0, 2.0]}, axes2d=True) as plot:
              hm.Line(x="x", y=hm.col.y + hm.sin(hm.view.time / 200))
          assert hm.export_png(plot, "plot.png")[:4] == b"\x89PNG"
          assert hm.export_svg(plot, "plot.svg").startswith(b"<svg")
          assert hm.export_pdf(plot, "plot.pdf")[:5] == b"%PDF-"
          hm.export_mp4(plot, "plot.mp4", duration=300, fps=10)
          print("exported PNG, SVG, PDF and MP4")

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
