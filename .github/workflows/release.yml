# Publishes a GitHub release to npm and PyPI through trusted publishing (R2.3): no tokens in the
# repository. The npm package carries provenance; PyPI gets attestations. Setting up the trusted
# publishers on npm and PyPI is the maintainer's (Phase 3). The release's test report (the full
# suite on a real GPU) is attached by hand, as TESTING.md describes.
name: Release

# A prerelease (the public alphas, 0.1.0-alpha.N) publishes nothing: it is installed from the
# release's own assets, the wheel and the npm tarball, until the packages go to npm and PyPI.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check:python-signatures
      - run: npm publish --provenance --access public

  pypi:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the notebook and standalone bundles into the wheel
        run: npm run build:python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
