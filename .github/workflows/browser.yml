# The browser suite on Chrome's software WebGPU (SwiftShader), daily rather than on every push:
# a run takes an hour or more, split across parallel runners (R2.3, decided 2026-09-28). The full
# suite also runs on a real GPU before each release (TESTING.md). Chrome's flags for SwiftShader
# without a GPU are in playwright.swiftshader.config.js.
name: Browser suite (SwiftShader)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: Browser suite, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The notebook and export bundles are built, not kept in git (R1.4): the Python examples
      # export their previews through standalone.js, and the export specs read it.
      - run: npm run build:python
      # The dev server builds the Python examples (scripts/build_examples.py) with python3: it
      # needs the package's dependencies, pandas for the penguins, and hatchling to build the
      # wheel the docs' Python editor installs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install hatchling "./python[dataframes]"
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test --config playwright.swiftshader.config.js --shard=${{ matrix.shard }}/4
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 14
